<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MasTebe | @tanjungbara30</title>
<meta name="description" content="Mulai lagi di usia 30, bukan mulai dari nol. Cek Spark Check dan gabung teman senasib.">
<meta property="og:title" content="MasTebe | Switch Career Usia 30-an">
<meta property="og:description" content="Mulai lagi di usia 30, bukan mulai dari nol.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: satu kolom sempit di tengah. Kepala (meter sparks + nama), lalu etalase berupa kartu tautan dari daftar data di script. Dark-first. */
:root{
  --bg:#1D2025; --surface:#272B32; --fg:#F3F1EC; --muted:#AEA9A0; --line:#3B4049;
  --accent:#FF9F1C; --accent-ink:#FF9F1C; --on-accent:#1D2025;
  --font-display:"Archivo","Arial Black",Arial,sans-serif;
  --font-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){--bg:#F3F1EC;--surface:#FBFAF7;--fg:#1D2025;--muted:#5E5A53;--line:#D8D3C8;--accent-ink:#8A4F00;color-scheme:light}
}
:root[data-theme="light"]{--bg:#F3F1EC;--surface:#FBFAF7;--fg:#1D2025;--muted:#5E5A53;--line:#D8D3C8;--accent-ink:#8A4F00;color-scheme:light}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:17px;line-height:1.5;
  min-height:100vh;padding-block:40px 36px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
.head{display:flex;flex-direction:column;gap:16px}
.handle{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.meter{display:flex;gap:5px;align-items:flex-end;height:48px;max-width:260px}
.meter i{flex:1;min-width:0;border-radius:3px;background:var(--line)}
.meter i:nth-child(1){height:30%}.meter i:nth-child(2){height:38%}.meter i:nth-child(3){height:46%}.meter i:nth-child(4){height:54%}.meter i:nth-child(5){height:62%}
.meter i:nth-child(6){height:70%}.meter i:nth-child(7){height:78%}.meter i:nth-child(8){height:86%}.meter i:nth-child(9){height:93%}.meter i:nth-child(10){height:100%}
.meter i.on{background:var(--accent)}
h1{font:900 clamp(48px,15vw,68px)/.95 var(--font-display);letter-spacing:-.03em;margin:0}
h1 .hi{display:block;font:700 clamp(18px,5.5vw,22px)/1.2 var(--font-body);letter-spacing:0;color:var(--muted);margin-bottom:8px}
.who{font:800 20px/1.25 var(--font-display);letter-spacing:-.01em;margin:0}
.who span{color:var(--accent-ink)}
.tag{color:var(--muted);margin:0}
.label{font:700 12px var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.list{display:flex;flex-direction:column;gap:12px;margin:0;padding:0;list-style:none}
.item{display:grid;grid-template-columns:1fr auto;gap:4px 14px;align-items:center;text-decoration:none;color:var(--fg);
  background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:18px 18px}
.item:hover{border-color:var(--muted)}
.item:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.item .t{font:800 20px/1.15 var(--font-display);letter-spacing:-.01em;min-width:0}
.item .d{grid-column:1;font-size:15px;color:var(--muted);min-width:0}
.item .go{grid-row:1/3;grid-column:2;font:900 22px var(--font-display);width:44px;height:44px;border-radius:10px;display:grid;place-items:center;
  border:1.5px solid var(--line);color:var(--fg)}
.item.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.item.primary .d{color:var(--on-accent);opacity:.85}
.item.primary .go{background:var(--on-accent);color:var(--accent);border-color:var(--on-accent)}
.badge{display:inline-block;font:800 11px var(--font-display);letter-spacing:.08em;text-transform:uppercase;border:1.5px solid currentColor;border-radius:6px;padding:2px 6px;margin-bottom:8px;width:fit-content}
.item .top{grid-column:1;min-width:0}
.foot{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
@media (prefers-reduced-motion:no-preference){.item{transition:border-color .15s}}
</style>
</head>
<body>
<main>
  <header class="head">
    <p class="handle">@tanjungbara30</p>
    <div class="meter" aria-hidden="true" id="meter"></div>
    <h1><span class="hi">Halo, kenalin gue</span>MasTebe</h1>
    <p class="who">Mantan Bos <span>yang jadi Jongos</span></p>
    <p class="tag">Mulai lagi di usia 30, bukan mulai dari nol. Teman senasib buat yang lagi kehilangan sparks atau mau switch karier.</p>
  </header>

  <section aria-labelledby="lbl">
    <p class="label" id="lbl">Mulai dari sini</p>
    <ul class="list" id="list"></ul>
  </section>

  <p class="foot">Switch Career Usia 30-an · @tanjungbara30</p>
</main>

<script>
// Tambah produk baru dengan menambah satu objek di sini. primary = tombol utama (amber).
var ITEMS = [
  { badge: "Gratis · 3 menit", title: "Spark Check", desc: "Cek sparks lo lagi di mana, lengkap dengan rencana 7 hari.", href: "spark/?src=bio", primary: true },
  { badge: "Komunitas WhatsApp", title: "Gabung teman senasib", desc: "Nyalain lagi Spark lo bareng orang yang lagi di fase yang sama.", href: "https://chat.whatsapp.com/J4YZeMvIwMCJVqiWuGwGZ5", primary: false, external: true }
];
(function () {
  var m = document.getElementById("meter");
  for (var i = 0; i < 10; i++) { var b = document.createElement("i"); if (i < 3) b.className = "on"; m.appendChild(b); }
  var ul = document.getElementById("list");
  ITEMS.forEach(function (it) {
    var li = document.createElement("li");
    var a = document.createElement("a");
    a.className = "item" + (it.primary ? " primary" : "");
    a.href = it.href;
    if (it.external) { a.target = "_blank"; a.rel = "noopener"; }
    var top = document.createElement("div"); top.className = "top";
    if (it.badge) { var bd = document.createElement("span"); bd.className = "badge"; bd.textContent = it.badge; top.appendChild(bd); }
    var t = document.createElement("div"); t.className = "t"; t.textContent = it.title; top.appendChild(t);
    var d = document.createElement("div"); d.className = "d"; d.textContent = it.desc;
    var go = document.createElement("span"); go.className = "go"; go.setAttribute("aria-hidden", "true"); go.textContent = "→";
    a.appendChild(top); a.appendChild(d); a.appendChild(go);
    li.appendChild(a); ul.appendChild(li);
  });
})();
</script>
</body>
</html>
